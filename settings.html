<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – Language Learning for Everyone</title>
  <link rel="stylesheet" href="style.css">
  <script src="apply-settings.js"></script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <p class="site-name">Language Learning for Everyone</p>
    <nav aria-label="Main menu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explorer.html">Language Explorer</a></li>
        <li><a href="settings.html" aria-current="page">Settings</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Settings</h1>
    <p>Change how the website looks and add your name. Your choices are saved on this device and used on every page.</p>

    <form class="settings-form" id="settings-form">
      <fieldset>
        <legend>Your name</legend>
        <label for="learnerName">Your first name (used in the "My name is…" example in every lesson)</label>
        <input type="text" id="learnerName" maxlength="30" autocomplete="given-name">
        <div class="captcha-buttons">
          <button type="submit" class="listen">Save my name</button>
          <button type="button" id="clearName" class="listen">Remove my name</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Text size</legend>
        <label><input type="radio" name="textSize" value="normal"> Normal</label>
        <label><input type="radio" name="textSize" value="large"> Large</label>
        <label><input type="radio" name="textSize" value="xlarge"> Extra large</label>
      </fieldset>

      <fieldset>
        <legend>Colours</legend>
        <label>
          <input type="checkbox" id="highContrast">
          High contrast (yellow and white on black)
        </label>
      </fieldset>
    </form>

    <!-- Screen readers announce this message -->
    <p id="settings-status" class="status" aria-live="polite"></p>
  </main>

  <footer>
    <p>Muhammad Sohaib</p>
  </footer>

  <script>
    const statusBox = document.getElementById("settings-status");
    const contrastBox = document.getElementById("highContrast");
    const nameBox = document.getElementById("learnerName");

    function saveSetting(name, value) {
      try {
        localStorage.setItem(name, value);
        return true;
      } catch (error) {
        statusBox.textContent = "Sorry, your browser could not save this setting.";
        return false;
      }
    }

    // Show the current choices when the page opens
    const currentSize = readSetting("textSize") || "normal";
    document.querySelector('input[name="textSize"][value="' + currentSize + '"]').checked = true;
    contrastBox.checked = readSetting("highContrast") === "on";
    nameBox.value = readSetting("learnerName") || "";

    // Save the name when the form is submitted (button or Enter key)
    document.getElementById("settings-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const name = nameBox.value.trim();
      if (name === "") {
        statusBox.textContent = "Please type your name first, or press Remove my name.";
        nameBox.focus();
        return;
      }
      if (saveSetting("learnerName", name)) {
        statusBox.textContent = "Thank you, " + name + ". Your name will now appear in every lesson.";
      }
    });

    document.getElementById("clearName").addEventListener("click", function () {
      try {
        localStorage.removeItem("learnerName");
      } catch (error) {}
      nameBox.value = "";
      statusBox.textContent = "Your name has been removed. Lessons will use the example name again.";
    });

    // Save and apply straight away when text size or colours change
    document.querySelectorAll('input[name="textSize"]').forEach(function (radio) {
      radio.addEventListener("change", function () {
        saveSetting("textSize", radio.value);
        applySettings();
        statusBox.textContent = "Text size changed to " + radio.parentElement.textContent.trim() + ".";
      });
    });

    contrastBox.addEventListener("change", function () {
      saveSetting("highContrast", contrastBox.checked ? "on" : "off");
      applySettings();
      statusBox.textContent = contrastBox.checked ? "High contrast is on." : "High contrast is off.";
    });
  </script>
</body>
</html>
